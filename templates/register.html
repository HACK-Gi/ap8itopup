{% extends "base.html" %}
{% block title %}ចុះឈ្មោះ{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card shadow">
            <div class="card-body">
                <h3 class="text-center mb-4">ចុះឈ្មោះ</h3>
                <form method="POST">
                    <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
                    <div class="mb-3">
                        <label>ឈ្មោះអ្នកប្រើ</label>
                        <input type="text" name="username" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label>អ៊ីមែល</label>
                        <input type="email" name="email" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label>ពាក្យសម្ងាត់</label>
                        <input type="password" name="password" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label>បញ្ជាក់ពាក្យសម្ងាត់</label>
                        <input type="password" name="confirm_password" class="form-control" required>
                    </div>
                    <button type="submit" class="btn btn-success w-100">ចុះឈ្មោះ</button>
                </form>
                <p class="mt-3 text-center">មានគណនីហើយ? <a href="{{ url_for('login') }}">ចូលគណនី</a></p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
